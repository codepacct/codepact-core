name: Documentation
description: A guide, example or comment is wrong or missing
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: README.md, docs/RULES.md, a source comment
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested wording or example
  - type: checkboxes
    id: verify
    attributes:
      label: Verification
      options:
        - label: I checked the command or example against the current code
