<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Codepact - the error-code contract for Soroban workspaces">
  <title>Codepact</title>
  <rect width="1200" height="320" fill="#0B1020"/>
  <g stroke="#16203A" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M700 0 V320 M840 0 V320 M980 0 V320 M1120 0 V320"/>
  </g>

  <text x="64" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="2" fill="#F5F0E8">CODEPACT</text>
  <text x="66" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8B94A8">the error-code contract for Soroban workspaces</text>
  <text x="66" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8B94A8">one registry, no collisions, enforced in CI</text>

  <g stroke="#22D3EE" stroke-width="2">
    <path d="M828 160 H842"/>
    <path d="M958 160 H972"/>
  </g>

  <g fill="#101A31" stroke="#22D3EE" stroke-width="3" stroke-linejoin="round">
    <polygon points="712,160 741,110 799,110 828,160 799,210 741,210"/>
    <polygon points="972,160 1001,110 1059,110 1088,160 1059,210 1001,210"/>
  </g>
  <g fill="#101A31" stroke="#F5A524" stroke-width="3" stroke-linejoin="round">
    <polygon points="842,160 871,110 929,110 958,160 929,210 871,210"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="770" y="172" fill="#22D3EE">100</text>
    <text x="900" y="172" fill="#F5A524">300</text>
    <text x="1030" y="172" fill="#22D3EE">300</text>
  </g>

  <circle cx="900" cy="250" r="22" fill="#F5A524"/>
  <path d="M900 238 V252" stroke="#0B1020" stroke-width="4" stroke-linecap="round"/>
  <circle cx="900" cy="260" r="2.6" fill="#0B1020"/>
  <text x="900" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#F5A524" text-anchor="middle">two contracts, one code</text>
</svg>
